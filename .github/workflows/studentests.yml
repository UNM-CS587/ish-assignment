name: Student Tests
'on':
  - push
  - pull_request
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-student-tests:
    runs-on: ubuntu-latest
    steps:
    - name: Install packages
      run: sudo apt-get update && sudo apt-get install -y libboost-all-dev flex bison libfl2 libfl-dev shelltestrunner libgtest-dev
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
    - name: Build
      run: cmake --build ${{github.workspace}}/build 
    - name: Student Tests
      run: |
        cd build
        ./studenttest/parser_test --gtest_output="xml:student-test-results.xml" || true
    - name: Publish Test Report
      uses: dorny/test-reporter@v1
      if: always() # Ensures report runs even if previous build steps had failed tests
      with:
        name: 'Student Test Results'
        path: 'build/student-test-results.xml'
        reporter: 'java-junit' # GoogleTest XML naturally matches the JUnit schema
        fail-on-error: 'true'  # Safely fails the workflow run if any tests actually failed
